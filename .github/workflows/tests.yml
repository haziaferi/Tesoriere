name: tests

# SPEC R43: the engine's JVM tests run on every push and pull request, with the build of both app
# modules and the check that the Android app declares no network permission (SPEC R08).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :shared:desktopTest :androidApp:verifyNoNetworkPermissionDebug :androidApp:assembleDebug :desktopApp:jar --no-daemon
